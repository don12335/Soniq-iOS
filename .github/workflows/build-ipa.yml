name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      soniq_ref:
        description: "Soniq branch/tag to build (empty = latest v* tag)"
        required: false
        default: ""
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      # input > this repo's tag (v0.1.45-ios.2 builds Soniq v0.1.45) > SONIQ_REF file > newest Soniq v* tag
      - name: Pick Soniq ref
        id: ref
        run: |
          REF="${{ inputs.soniq_ref }}"
          if [ -z "$REF" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then REF="${GITHUB_REF_NAME%%-ios.*}"; fi
          if [ -z "$REF" ] && [ -s SONIQ_REF ]; then REF="$(tr -d '[:space:]' < SONIQ_REF)"; fi
          if [ -z "$REF" ]; then
            REF=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/don12335/Soniq.git 'v*' | head -1 | sed 's#.*refs/tags/##')
          fi
          echo "Building Soniq at $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: don12335/Soniq
          ref: ${{ steps.ref.outputs.ref }}
          path: soniq

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Soniq renderer (iOS mode)
        run: SONIQ_DIR="$GITHUB_WORKSPACE/soniq" bash scripts/build-web.sh

      - name: Sync Capacitor iOS project
        run: |
          npm ci
          npx cap sync ios

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./soniq/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Archive (unsigned)
        run: |
          xcodebuild -quiet -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Soniq.xcarchive" \
            MARKETING_VERSION=${{ steps.ver.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: bash scripts/package-ipa.sh "$RUNNER_TEMP/Soniq.xcarchive" "Soniq-${{ steps.ver.outputs.version }}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: soniq-ios
          path: Soniq-*.ipa

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Soniq-*.ipa
          fail_on_unmatched_files: true
          generate_release_notes: true
